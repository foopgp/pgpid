version = 1

# Files that cannot carry an SPDX header, and files that are not ours.
#
# Two kinds live here. The first is our own material that a tool regenerates:
# a header written by hand would be wiped on the next run, so it is declared
# here instead. The second is reference material — specifications, specimen
# images, trained OCR data — which we did not write and cannot license. See
# LICENSES/LicenseRef-reference-material.txt.

# --- ours, regenerated by tooling -------------------------------------------

[[annotations]]
path = [ "po/pgpid.pot", "po/*.po" ]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2021-2026 Friends Of OpenPGP organization <info@foopgp.org>",
    "2021-2026 Jean-Jacques Brucker (u4=sRyUhEbNU5OwyLEjfSwaXAe_42.17-002.76) <jjbrucker@foopgp.org>",
    "2026 Mnêmê (u5001777236237.945e_43.30_005.38 claude-opus-5) <mneme@foopgp.org>",
]
SPDX-License-Identifier = "GPL-3.0-only"

# --- reference material, not ours -------------------------------------------

# ICAO Doc 9303, Machine Readable Travel Documents. The specification pgpid
# reads MRZ against. ICAO copyright; kept for reference, not redistributable
# on our terms.
[[annotations]]
path = "doc/9303_*.pdf"
precedence = "aggregate"
SPDX-FileCopyrightText = "International Civil Aviation Organization (ICAO)"
SPDX-License-Identifier = "LicenseRef-reference-material"

# Published research and conference material on electronic passports.
[[annotations]]
path = [
    "doc/Říha2009_Chapter_AnOverviewOfElectronicPassport.pdf",
    "doc/bh_us_08_van_Beek_ePassports_Reloaded_Slides.pdf",
    "doc/key_overwriting_attack.pdf",
    "doc/ISO14443_Overview-v5.pdf",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "the respective authors and publishers"
SPDX-License-Identifier = "LicenseRef-reference-material"

# Identity-document images collected from PRADO, the public register operated
# by the Council of the European Union, plus a few specimens. Test fixtures
# for the MRZ scanner.
[[annotations]]
path = [
    "imgsamples/*.jpg",
    "imgsamples/*.JPG",
    "imgsamples/*.png",
    "imgsamples/scan_nok/101737.jpg",
    "imgsamples/scan_nok/109508.JPG",
    "imgsamples/scan_nok/119603.jpg",
    "imgsamples/scan_nok/121146.JPG",
    "imgsamples/scan_nok/211185.jpg",
    "imgsamples/scan_nok/235115.JPG",
    "imgsamples/scan_nok/244972.jpg",
    "imgsamples/scan_nok/261923.jpg",
    "imgsamples/scan_nok/97060.JPG",
    "imgsamples/scan_nok/P_CHNCHUNG__KWOK_SUM.jpg",
    "imgsamples/scan_nok/P_FRAHOLLANDE__FRANCOIS.jpg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Council of the European Union (PRADO) and the respective issuing authorities"
SPDX-License-Identifier = "LicenseRef-reference-material"

# Tesseract training data and a dump of tesseract's own parameter list.
[[annotations]]
path = [ "data/mrz.traineddata", "data/tesseract.parameters.ref", "oldies/data/mrz_best.traineddata" ]
precedence = "aggregate"
SPDX-FileCopyrightText = "the Tesseract OCR project and its contributors"
SPDX-License-Identifier = "LicenseRef-reference-material"

# Country centroids, and a list derived from them. Natural Earth data is
# public domain, but we did not produce it and do not warrant the derivation.
[[annotations]]
path = [ "oldies/data/country_centroids_az8.csv", "oldies/data/geolist_centroid.txt" ]
precedence = "aggregate"
SPDX-FileCopyrightText = "Natural Earth <https://www.naturalearthdata.com/>"
SPDX-License-Identifier = "LicenseRef-reference-material"

# A conversation kept as a design note. It is not only ours — the other side
# of it belongs to whoever wrote it.
[[annotations]]
path = "oldies/notes/pgpid-cert"
precedence = "aggregate"
SPDX-FileCopyrightText = "the participants in the conversation"
SPDX-License-Identifier = "LicenseRef-reference-material"

# A still from the television series "Friends", kept as a negative test case:
# an image the scanner must decline rather than read an MRZ out of.
[[annotations]]
path = "imgsamples/scan_nok/friends.jpg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Warner Bros. Entertainment Inc."
SPDX-License-Identifier = "LicenseRef-reference-material"
